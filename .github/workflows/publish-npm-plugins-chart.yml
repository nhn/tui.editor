# @toast-ui/editor-plugin-chart를 npm 승인 대기열에 올린다 (npm staged publishing).
# 플러그인은 각각 독립 버전으로 배포된다. 이 워크플로는 chart 플러그인 전용이다.
# @toast-ui/chart는 external이라 번들에 안 들어가고, 의존 범위만 메타데이터로 올라간다.
#
# npmjs.com 설정: @toast-ui/editor-plugin-chart → Settings → Trusted Publisher
#   GitHub Actions / nhn / tui.editor / publish-npm-plugins-chart.yml / Environment 비움
#   Allowed actions 체크 없음 (stage publish만 허용)
name: Npm Publish (plugin chart)
on:
  workflow_dispatch:

concurrency:
  group: publish-plugin-chart
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_DIRECTORY: plugins/chart

jobs:
  check-package:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      - name: check package
        id: package
        run: |
          NAME=$(node -p "require('./${PACKAGE_DIRECTORY}/package.json').name")
          VERSION=$(node -p "require('./${PACKAGE_DIRECTORY}/package.json').version")

          # Trusted Publishing은 repository.url이 이 저장소와 정확히 같아야 한다
          node -e '
            const pkg = require(`./${process.env.PACKAGE_DIRECTORY}/package.json`);
            const url = typeof pkg.repository === "string" ? pkg.repository : (pkg.repository || {}).url || "";
            const normalized = url.replace(/^git\+/, "").replace(/\.git$/, "");
            const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            if (normalized !== expected) {
              console.log(`::error::repository.url(${url})이 ${expected}와 다르다. provenance 검증에서 배포가 실패한다.`);
              process.exit(1);
            }
          '

          # npm은 같은 버전 번호를 다시 쓸 수 없다
          if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]; then
            echo "::error::${NAME}@${VERSION}은 이미 배포된 버전이다."
            exit 1
          fi

          case "$VERSION" in
            *-*)
              echo "::error::프리릴리스 버전(${VERSION})은 latest로 배포하지 않는다."
              exit 1
              ;;
          esac

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  lint-types:
    runs-on: ubuntu-latest
    needs: [check-package]
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      - name: use Node.js 15 (build toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '15'
          cache: 'npm'
      - name: npm ci
        run: npm ci
      - name: eslint
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm run lint
      - name: check types
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm run test:types

  test:
    runs-on: ubuntu-latest
    needs: [check-package]
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      - name: use Node.js 15 (build toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '15'
          cache: 'npm'
      - name: npm ci
        run: npm ci
      # 플러그인은 editor 타입에 의존하므로 editor 빌드를 선행한다
      - name: build editor deps
        run: |
          npm run build toastmark
          npm run build editor
      - name: chart plugin test
        run: npm run test:ci chart

  stage:
    runs-on: ubuntu-latest
    needs: [check-package, lint-types, test]
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing(OIDC)
    env:
      NAME: ${{ needs.check-package.outputs.name }}
      VERSION: ${{ needs.check-package.outputs.version }}
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      # 빌드는 Node 15에서만 된다
      - name: use Node.js 15 (build)
        uses: actions/setup-node@v4
        with:
          node-version: '15'
          cache: 'npm'
      - name: npm ci
        run: npm ci
      - name: build
        run: |
          npm run build toastmark
          npm run build editor
          npm run build chart
      # staged publishing은 Node 22.14+와 npm 11.15.0+가 필요하다
      - name: use Node.js 24 (stage)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: update npm
        run: npm install -g npm@^11.15.0
      - name: npm stage publish
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm stage publish
      - name: write summary
        run: |
          {
            echo "## ${NAME}@${VERSION} 승인 대기"
            echo ""
            echo "1. \`npm stage list ${NAME}\`로 stage-id를 확인한다."
            echo "2. \`npm stage download <stage-id>\`로 tarball을 받아 검증한다."
            echo "3. npmjs.com Staged Packages 탭 또는 \`npm stage approve <stage-id>\`로 승인한다. 2FA가 필요하다."
            echo "4. 승인 뒤 git 태그: \`git tag ${NAME#@toast-ui/}@${VERSION} && git push origin ${NAME#@toast-ui/}@${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
